<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Assistant</title>
    <!-- Подключение внешнего CSS файла -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключение шрифта -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-container">
        
        <!-- Верхняя панель -->
        <header class="top-bar">
            <button class="burger-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="auth-buttons">
                <button class="btn btn-signin">Sign In</button>
                <button class="btn btn-signup">Sign Up</button>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main-content">
            <h1>Recipe<br>Assistant</h1>
            
            <div class="image-wrapper">
                <div class="glow-effect"></div>
                <!-- НЕ ЗАБУДЬ ЗАМЕНИТЬ ССЫЛКУ НА СВОЮ КАРТИНКУ -->
                <img src="fork.png" alt="Вилка и нож" class="main-image">
            </div>

            <p class="description">
                Отметьте продукты, которые есть у вас дома, — и мы подскажем, что из них можно приготовить. Никаких лишних походов в магазин.
            </p>
        </main>

        <!-- Кнопка внизу -->
        <button class="btn-start">НАЧАТЬ ПОДБОР</button>

    </div>

</body>
</html>
